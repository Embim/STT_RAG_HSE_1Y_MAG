[project]
name = "stt-rag-hse-1y-mag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.133.1",
    "httpx[socks]>=0.28.1",
    "langchain-core>=1.2.16",
    "langchain-text-splitters>=1.1.1",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "streamlit>=1.54.0",
    "uvicorn>=0.41.0",
    "weaviate-client>=4.20.1",
    "yt-dlp>=2026.2.21",
    "langfuse>=3.0.0",
    "sqlmodel>=0.0.38",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "psycopg2-binary>=2.9.12",
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.13.0.92",
    "numpy>=2.4.2",
    # 3D-карта эмбеддингов: снижение размерности (PCA), кластеризация (KMeans),
    # подписи тем (TF-IDF). umap-learn — опционально (extra `viz`), иначе PCA.
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
    "jiwer>=3.0.0",
    "datasets>=3.0.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "soundfile>=0.12.0",
    "pandas>=2.0.0",
    # MLflow client — judge.runner + asr.benchmark_runner логируют per-chunk
    # timeline и corpus rollup. Без него tracked_run уходит в noop и прогон
    # отработает молча, без записи в UI.
    "mlflow>=2.18.0",
]
ops = [
    "mlflow>=2.18.0",
    "boto3>=1.35.0",
    "nvidia-ml-py>=12.560.30",
    "psutil>=5.9.0",
]
# Лучшее разделение кластеров в 3D-карте эмбеддингов. Без этого extra карта
# строится на PCA (легче, но кластеры разделяются хуже). umap-learn тянет
# numba/llvmlite — ставить на GPU-боксе: uv sync --extra viz
viz = [
    "umap-learn>=0.5.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
